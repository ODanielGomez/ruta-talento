<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruta Talento · Administración</title><style>body{font:16px system-ui;background:#eff5ee;color:#183431;margin:0}main{max-width:850px;margin:40px auto;padding:24px}.box{background:white;border-radius:18px;padding:24px;margin:15px 0}input,select,button{font:inherit;padding:10px;border:1px solid #b8ccc0;border-radius:8px}input{max-width:100%}button{background:#176c68;color:white;border:0;cursor:pointer}label{display:block;margin:12px 0}label input{display:block;width:100%;box-sizing:border-box}header{display:flex;justify-content:space-between;align-items:center}li{margin:9px 0}li button{font-size:12px;margin-left:8px}.error{color:#a23c30}.muted{color:#5f716a}</style></head><body><main><header><h1>🌱 Ruta Talento</h1><button id="exit" hidden>Cerrar sesión</button></header><section class="box" id="login"><h2>Acceso de administración</h2><label>Correo<input id="email" type="email" autocomplete="username"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password"></label><button id="signin">Ingresar</button><p class="error" id="error"></p></section><section id="dashboard" hidden><div class="box"><h2>⚙️ Catálogos</h2><p class="muted">Administra las opciones de las listas para tu empresa.</p><select id="kind"><option value="areas">Áreas</option><option value="cargos">Cargos</option><option value="jefes">Jefes</option><option value="competencias">Competencias</option><option value="retos">Tipos de reto</option><option value="plazos">Seguimientos</option></select><ul id="items"></ul><input id="newitem" placeholder="Nueva opción"><button id="add">Añadir</button><p id="status" class="error"></p></div><div class="box"><h2>🚧 Próximas funciones</h2><p>Trabajadores, enlaces, resultados y diplomas todavía están en construcción.</p></div></section></main><script type="module" src="./panel-real.js"></script></body></html>
